<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tessera Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: prototype chrome strip on top, product app below with left nav (desktop) / bottom tab bar (phone). Drawers slide from right. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface-2:#E8EFE9; --line:#DAE4DC; --line-strong:#B5C7BA;
  --ink:#12201A; --ink-2:#3D4E46; --ink-3:#64766D;
  --accent:#1F7A5C; --accent-ink:#FFFFFF; --accent-soft:#DCF0E6; --accent-strong:#135A42;
  --good:#1F7A5C; --good-soft:#DCF0E6;
  --gold:#A8730F; --gold-soft:#F7EBCD;
  --bad:#C2412D; --bad-soft:#FBE6E1;
  --chrome:#0F2A21; --chrome-ink:#EEF6F1; --chrome-2:#1E4436;
  --scrim:rgba(15,42,33,.45);
  --av1:#F7EBCD; --av1f:#8A5A08; --av2:#DCF0E6; --av2f:#1F7A5C; --av3:#E8EFE9; --av3f:#34463E; --av4:#E1ECF4; --av4f:#2B6CB0; --av5:#F6E4DF; --av5f:#8A3B2A;
  --tomato:#E3A93B; --butter:#F2F5F1; --mint:#1F7A5C; --violet:#3D4E46;
  --shadow:0 1px 2px rgba(15,42,33,.05),0 10px 28px rgba(15,42,33,.07);
  --shadow-lg:0 22px 60px rgba(15,42,33,.26);
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1613; --surface:#13221C; --surface-2:#0F1D18; --line:#21372E; --line-strong:#35574A;
  --ink:#EDF5F0; --ink-2:#B3C6BC; --ink-3:#84998E;
  --accent:#4FC79A; --accent-ink:#0C1613; --accent-soft:#163A2D; --accent-strong:#86E3BF;
  --good:#6FD3A8; --good-soft:#163A2D; --gold:#F2C46B; --gold-soft:#2E2817; --bad:#F28B82; --bad-soft:#3A2325;
  --chrome:#08110E; --chrome-ink:#EDF5F0; --chrome-2:#21372E; --scrim:rgba(0,0,0,.62);
  --av1:#2E2817; --av1f:#F2C46B; --av2:#163A2D; --av2f:#6FD3A8; --av3:#1B2C25; --av3f:#D6E3DC; --av4:#16283A; --av4f:#8EC5E8; --av5:#36232A; --av5f:#F28B82;
  --tomato:#E3A93B; --butter:#EDF5F0; --mint:#6FD3A8; --violet:#84998E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1613; --surface:#13221C; --surface-2:#0F1D18; --line:#21372E; --line-strong:#35574A;
  --ink:#EDF5F0; --ink-2:#B3C6BC; --ink-3:#84998E;
  --accent:#4FC79A; --accent-ink:#0C1613; --accent-soft:#163A2D; --accent-strong:#86E3BF;
  --good:#6FD3A8; --good-soft:#163A2D; --gold:#F2C46B; --gold-soft:#2E2817; --bad:#F28B82; --bad-soft:#3A2325;
  --chrome:#08110E; --chrome-ink:#EDF5F0; --chrome-2:#21372E; --scrim:rgba(0,0,0,.62);
  --av1:#2E2817; --av1f:#F2C46B; --av2:#163A2D; --av2f:#6FD3A8; --av3:#1B2C25; --av3f:#D6E3DC; --av4:#16283A; --av4f:#8EC5E8; --av5:#36232A; --av5f:#F28B82;
  --tomato:#E3A93B; --butter:#EDF5F0; --mint:#6FD3A8; --violet:#84998E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.32); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:600;line-height:1.2}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* prototype chrome */
.proto{position:sticky;top:0;z-index:30;background:var(--chrome);color:var(--chrome-ink);display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,8px);gap:2px}
.tiles i{width:8px;height:8px;border-radius:2px;background:var(--tomato)}
.tiles i:nth-child(2){background:var(--butter)} .tiles i:nth-child(3){background:var(--mint)} .tiles i:nth-child(4){background:var(--violet)}
.ptag{font-size:11px;padding:2px 8px;border:1px solid var(--chrome-2);border-radius:99px;color:var(--chrome-ink);opacity:.8}
.seg{display:flex;background:var(--chrome-2);border-radius:8px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:transparent;color:var(--chrome-ink);padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;opacity:.75}
.seg button.on{background:var(--surface);color:var(--ink);opacity:1}
.pbtn{border:1px solid var(--chrome-2);background:transparent;color:var(--chrome-ink);padding:5px 10px;border-radius:7px;font-size:13px}
.pbtn:hover{background:var(--chrome-2)}

/* app shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 48px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:48px;height:calc(100vh - 48px)}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.who .n{font-weight:600;line-height:1.2} .who .s{font-size:12px;color:var(--ink-3)}
.navi{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.navi:hover{background:var(--surface-2)}
.navi.on{background:var(--accent-soft);color:var(--accent-strong)}
.navi svg{width:18px;height:18px;flex:none}
.navi .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--ink-2);padding:1px 7px;border-radius:99px}
.navi.on .cnt{background:var(--surface)}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:10px;border-top:1px solid var(--line)}
main{min-width:0;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--ink-2)}
.tabbar{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--line-strong)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:11px 18px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)} .iconbtn svg{width:16px;height:16px}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-strong)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.out{background:transparent;border:1px solid var(--line-strong)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-applied{background:var(--surface-2);color:var(--ink-2)}
.st-shortlisted{background:var(--good-soft);color:var(--good)}
.st-offer{background:var(--gold-soft);color:var(--gold)}
.st-selected{background:var(--accent-soft);color:var(--accent-strong)}
.st-declined,.st-withdrawn{background:var(--bad-soft);color:var(--bad)}
.av{flex:none;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:13px;width:36px;height:36px}
.logo{flex:none;display:grid;place-items:center;border-radius:9px;font-family:var(--f-display);font-weight:700;width:38px;height:38px;font-size:15px}
.c1{background:var(--av1);color:var(--av1f)} .c2{background:var(--av2);color:var(--av2f)} .c3{background:var(--av3);color:var(--av3f)} .c4{background:var(--av4);color:var(--av4f)} .c5{background:var(--av5);color:var(--av5f)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.divider{height:1px;background:var(--line)}

/* KPI tiles */
.kpi{padding:16px 18px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.gold>i{background:var(--gold)}

/* score ring */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke-linecap:round}
.ring.strong .fg{stroke:var(--accent)} .ring.good .fg{stroke:var(--good)} .ring.stretch .fg{stroke:var(--gold)} .ring.na .fg{stroke:var(--line-strong)}
.ring span{font-family:var(--f-display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.band{font-size:11.5px;font-weight:600}
.band.strong{color:var(--accent)} .band.good{color:var(--good)} .band.stretch{color:var(--gold)}

/* banners */
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.banner.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.banner.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.banner .t{flex:1;min-width:0}
.banner b{font-weight:600}
.banner svg{width:18px;height:18px;flex:none}

/* campaign cards */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ccard{padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.ccard:hover{border-color:var(--line-strong)}
.ccard .title{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.3;margin:0;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
.ccard .title:hover{color:var(--accent)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;color:var(--ink-3)}
.reason{display:flex;gap:8px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.reason svg{width:16px;height:16px;flex:none;color:var(--accent);margin-top:1px}
.reason.warn svg{color:var(--gold)}
.reason.warn{background:var(--gold-soft);color:var(--gold)}
.comp{font-weight:600;font-variant-numeric:tabular-nums}
.urgent{color:var(--bad)!important}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 240px;min-width:0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.sel{padding:8px 30px 8px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);user-select:none;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--surface-2);padding:1px 7px;border-radius:99px;margin-left:5px;color:var(--ink-2)}
.resultline{font-size:13px;color:var(--ink-3)}

/* empty + skeleton */
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-2)}
.empty .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.empty .ic svg{width:22px;height:22px}
.empty h3{color:var(--ink)}
.empty p{margin:0;max-width:420px}
.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--line) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}.drawer,.modal{transition:none!important}}

/* lists / tables */
.list{display:flex;flex-direction:column}
.li{display:grid;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li-app{grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1fr) auto}
.li-cand{grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.3fr) 92px auto}
.li-camp{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) auto}
.thead{display:grid;gap:14px;padding:10px 18px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.name-btn{border:0;background:none;padding:0;font-weight:600;color:var(--ink);text-align:left}
.name-btn:hover{color:var(--accent)}
.steps{display:flex;gap:4px;align-items:center}
.steps i{height:4px;flex:1;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.steps.bad i.on{background:var(--bad)}
.stat{display:flex;flex-direction:column}
.stat b{font-variant-numeric:tabular-nums;font-weight:600}
.stat small{color:var(--ink-3);font-size:11.5px}
.small{font-size:12.5px}

/* overlay: drawer + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.dhead{padding:16px 22px;padding-top:max(16px,env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dbody{flex:1;overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:16px}
.dfoot{padding:14px 22px;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;width:min(620px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--surface);border-radius:var(--r-lg);z-index:42;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);transition:all .18s}
.modal.wide{width:min(980px,calc(100% - 24px))}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.mbody{padding:20px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.mfoot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.breakdown{display:flex;flex-direction:column;gap:12px}
.bd{display:grid;grid-template-columns:120px 1fr 52px;gap:12px;align-items:center;font-size:13px}
.bd .note{grid-column:2/4;font-size:12.5px;color:var(--ink-2);margin-top:-6px}
.bd .pts{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.gate{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.gate svg{width:16px;height:16px;flex:none;margin-top:2px}
.gate.ok svg{color:var(--accent)} .gate.no svg{color:var(--bad)}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:500;font-size:13px}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--bad)}
.input,textarea.input{padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);width:100%}
textarea.input{min-height:110px;resize:vertical}
.input.bad{border-color:var(--bad)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checkchip{position:relative}
.checkchip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.checkchip span{display:inline-block;padding:6px 12px;border:1px solid var(--line-strong);border-radius:99px;font-size:13px;color:var(--ink-2)}
.checkchip input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:500}
.checkchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.prefix{position:relative}.prefix span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}.prefix .input{padding-left:24px}

.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 8px}
.success .ic{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.success .ic svg{width:28px;height:28px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.35);border-top-color:var(--accent-ink);border-radius:50%;animation:spin .7s linear infinite}

.preview{background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.preview .big{font-family:var(--f-display);font-size:30px;font-weight:600}

.toast.on{opacity:1;transform:translate(-50%,0)}

.aud{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:12.5px}

.aud:not(.hl) .bar>i{background:var(--line-strong)}
.plat{display:flex;gap:10px;flex-wrap:wrap}
.platbox{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.platbox .v{font-family:var(--f-display);font-weight:600;font-size:18px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const inrK = n => !n ? '₹0' : n>=100000 ? '₹'+(n/100000).toFixed(n%100000?2:0).replace(/\.?0+$/,'')+'L' : '₹'+(n/1000).toFixed(n%1000?1:0).replace(/\.0$/,'')+'K';
const fol = n => n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'K' : String(n);
const pct = x => Math.round(x*100)+'%';
const D = s => new Date(s+'T00:00:00');
const fmtD = s => D(s).toLocaleDateString('en-IN',{day:'numeric', month:'short'});
const daysTo = s => Math.round((D(s)-TODAY)/86400000);
function addDays(s,n){ const d=D(s); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return '2026-11-10'; }
const initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('');
const avc = id => 'c'+(1+(parseInt(id.replace(/\D/g,''),10)%5));

  if(k.type==='Product only') return `Product worth ${inr(k.productValue)}`;
  return `${inrK(k.budget[0])}–${inrK(k.budget[1])}`;
}
function packageRate(c,k){ return k.deliv.reduce((s,[t,n])=> s + (c.rates[t]||0)*n, 0); }
const platsOf = k => [...new Set(k.deliv.map(d=>DELIV[d[0]].p))];

/* ============ Matching: rule-based, explainable =============
   Step 1  Hard requirements (pass/fail): platforms, min followers on main platform, city, applications open.
   Step 2  Score out of 100:
           Niche fit 30 · Audience fit 30 (gender 12, age 12, location 6) · Engagement 20 · Budget fit 15 · Reliability 5
   Labels: 80+ Strong · 65–79 Good · below 65 Stretch                                                        */
const BENCH = f => f<10000?4.0 : f<100000?3.0 : f<500000?2.0 : 1.4;
const TIER = f => f<10000?'under 10K' : f<100000?'10K–100K' : f<500000?'100K–500K':'500K+';
function band(s){ return s>=80?'strong':s>=65?'good':'stretch'; }
const BAND_LABEL = {strong:'Strong match', good:'Good match', stretch:'Stretch'};

function evaluate(c, k, quote){
  const gates=[]; const plats=platsOf(k); const main=plats[0];
  plats.forEach(p=>{ const has=!!c.platforms[p]; gates.push({ok:has, text: has? `Has a ${PLAT[p]} account` : `Requires a ${PLAT[p]} account`}); });
  const mf = c.platforms[main] ? c.platforms[main].f : 0;
  if(k.minF){ const ok = mf>=k.minF; gates.push({ok, text: ok ? `${fol(mf)} ${PLAT[main]} followers (minimum ${fol(k.minF)})` : `Needs ${fol(k.minF)}+ ${PLAT[main]} followers. Has ${fol(mf)}, ${fol(k.minF-mf)} short`, short: ok?null:`Needs ${fol(k.minF)}+ ${PLAT[main]} followers`}); }
  if(k.city){ const ok = c.city===k.city; gates.push({ok, text: ok? `Based in ${k.city} (on-site requirement)` : `${k.city}-based creators only (on-site work). Based in ${c.city}`, short: ok?null:`${k.city}-based creators only`}); }
  const open = k.status==='open' && daysTo(k.applyBy)>=0;
  if(!open) gates.push({ok:false, text:'Applications closed'});
  const eligible = gates.every(g=>g.ok);

  const parts=[];
  // Niche
  let n=0, nn;
  if(c.cats.slice(0,2).includes(k.cat)){ n=30; nn=`${k.cat} is a primary niche`; }
  else if(c.cats.includes(k.cat)){ n=22; nn=`${k.cat} is a secondary niche`; }
  else { const rel=c.cats.find(x=>(RELATED[x]||[]).includes(k.cat)); if(rel){ n=10; nn=`${k.cat} is close to their ${rel} content`; } else { n=0; nn=`${k.cat} is outside their niches`; } }
  parts.push({key:'niche', label:'Niche fit', pts:n, max:30, note:nn});
  // Audience
  const t=k.target, a=c.aud;
  const gShare = t.gender==='all'?1 : t.gender==='female'? a.female : 1-a.female;
  const g = t.gender==='all'?12 : 12*Math.min(1,gShare/.75);
  const ageShare = t.ages.reduce((s,x)=>s+a.ages[x],0);
  const ag = 12*Math.min(1, ageShare/.8);
  const geo = t.geo==='india'?6 : 6*Math.min(1, a.metro/.7);
  const audParts=[];
  if(t.gender!=='all') audParts.push(`${pct(gShare)} ${t.gender==='female'?'women':'men'}`);
  audParts.push(`${pct(ageShare)} aged ${t.ages.map(x=>AGE_LABEL[x]).join(', ')}`);
  if(t.geo==='metro') audParts.push(`${pct(a.metro)} in metros`);
  parts.push({key:'aud', label:'Audience fit', pts:g+ag+geo, max:30, note:'Audience is '+audParts.join(' · '), sub:{g,ag,geo,gShare,ageShare}});
  // Engagement on main platform
  const pm = c.platforms[main] || Object.values(c.platforms)[0];
  const bench = BENCH(pm.f); const e = 20*Math.min(1, pm.er/(bench*1.6));
  parts.push({key:'eng', label:'Engagement', pts:e, max:20, note:`${pm.er}% engagement on ${PLAT[c.platforms[main]?main:'instagram']} vs ${bench.toFixed(1)}% typical for ${TIER(pm.f)} accounts`});
  // Budget
  let b, bn; const price = quote!=null ? quote : packageRate(c,k);
  if(k.type==='Product only'){ b=3; bn='Product only, no fee'; }
  else if(k.budget[1]>=price){ b=15; bn= quote!=null ? `Quote ${inrK(price)} is within the ${inrK(k.budget[0])}–${inrK(k.budget[1])} budget` : `Budget up to ${inrK(k.budget[1])} covers the usual ${inrK(price)} rate`; }
  else if(k.budget[1]>=.8*price){ b=9; bn=`Pays up to ${inrK(k.budget[1])}, a little under the usual ${inrK(price)}`; }
  else { b=3; bn=`Pays up to ${inrK(k.budget[1])}, well under the usual ${inrK(price)}`; }
  parts.push({key:'budget', label:'Budget fit', pts:b, max:15, note:bn});
  // Reliability
  let r, rn;
  if(c.done>=3){ r=5*c.onTime/c.done; rn=`${c.onTime} of ${c.done} past collaborations delivered on time`; }
  else { r=4; rn=`New on Tessera (${c.done} collab${c.done===1?'':'s'}), scored neutral`; }
  parts.push({key:'rel', label:'Reliability', pts:r, max:5, note:rn});

  const score = Math.round(parts.reduce((s,p)=>s+p.pts,0));
  const sorted = parts.slice().sort((x,y)=>(y.pts/y.max)-(x.pts/x.max));
  const reasons = sorted.filter(p=>p.pts/p.max>=.8 && p.key!=='rel').map(p=>p.note);
  const gaps = parts.filter(p=>p.pts/p.max<.6).map(p=>p.note);
  return {eligible, gates, parts, score, band: band(score), reasons, gaps, failed: gates.filter(g=>!g.ok)};
}

function profileStrength(){
  const m=me();
  const items=[
    {ok:true, label:'Instagram connected and verified', why:''},
    {ok:true, label:'Audience insights synced', why:''},
    {ok:Object.keys(m.rates).length>=3, label:'Rates set for your deliverables', why:''},
    {ok:m.cats.length>=2, label:'At least two niches chosen', why:'Niche fit is 30% of every match score.'},
    {ok:S.ytVerified, label:'YouTube audience verified', why:'Brands see a verified badge. Unverified numbers are shown as self-reported.'}
  ];
  const done=items.filter(i=>i.ok).length;
  return {items, done, pct:Math.round(done/items.length*100)};
}
function appNextStep(a,k){
  const decideBy = fmtD(addDays(k.applyBy,5));
  return {applied:`Decision by ${decideBy}`, shortlisted:`Shortlisted · offers by ${decideBy}`, offer:'Respond to offer', selected:`Content due ${fmtD(k.due)}`, declined: a.reason||'Not selected', withdrawn:'Withdrawn'}[a.status];
}
function miniCampaign(x){

function discoverSets(){
  const m=me(); let feed=creatorFeed();
  const q=UI.q.trim().toLowerCase();
  const f = feed.filter(({k,e})=>{
    if(q && !(`${k.title} ${BRANDS[k.brand].name} ${k.cat}`.toLowerCase().includes(q))) return false;
    if(UI.niche!=='all' && k.cat!==UI.niche) return false;
    if(UI.plat!=='all' && !platsOf(k).includes(UI.plat)) return false;
    if(+UI.comp>0){ const pay = k.type==='Product only'? 0 : k.budget[1]; if(pay < +UI.comp) return false; }
    if(UI.ctype!=='all' && k.type!==UI.ctype) return false;
    if(UI.audfit && e.parts[1].pts<24) return false;
    if(!m.productOnly && k.type==='Product only') return false;
    return true;
  });
  const sorters = {match:(a,b)=>b.e.score-a.e.score, pay:(a,b)=>(b.k.budget[1]||0)-(a.k.budget[1]||0), closing:(a,b)=>a.k.applyBy.localeCompare(b.k.applyBy), new:(a,b)=>b.k.posted.localeCompare(a.k.posted)};
  f.sort(sorters[UI.sort]);
  return {eligible:f.filter(x=>x.e.eligible), not:f.filter(x=>!x.e.eligible), saved:f.filter(x=>S.saved[x.k.id]), total:feed.length};
}
function renderDiscoverResults(){
  const sets=discoverSets();

  tabsEl.innerHTML = tabs.map(([id,l,n])=>`<button class="tab ${UI.dtab===id?'on':''}" role="tab" aria-selected="${UI.dtab===id}" data-act="dtab" data-t="${id}">${l}<span class="cnt">${n}</span></button>`).join('');
  const box=document.getElementById('results');
  if(!UI.loaded.discover){

  if(!list.length){
    const msg = UI.dtab==='saved' ? ['Nothing saved yet','Save campaigns to compare them before applying.'] : UI.dtab==='not' ? ['You qualify for everything here','No campaigns in this view have requirements you miss.'] : ['No campaigns match these filters','Try a wider pay range or a different niche.'];

function validateApply(){
  const k=campaign(AF.kid); AF.errors={};
  if(AF.step===1){
    if(k.type!=='Product only'){ const q=+String(AF.quote).replace(/[^\d]/g,''); AF.quote=q; if(!q) AF.errors.quote='Enter your quote in rupees.'; else if(q<1000) AF.errors.quote='Quotes start at ₹1,000.'; }
    if(!AF.canDeliver) AF.errors.canDeliver='Confirm you can deliver by the due date.';
  }
  if(AF.step===2){
    const n=AF.pitch.trim().length;
    if(n<80) AF.errors.pitch=`Add a little more. ${80-n} more characters needed.`;
    if(AF.link && !/^https:\/\/\S+\.\S+/.test(AF.link.trim())) AF.errors.link='Use a full link starting with https://';
    if(!AF.disclose) AF.errors.disclose='This confirmation is required for paid campaigns.';
  }
  return !Object.keys(AF.errors).length;
}
function submitApply(){
  AF.submitting=true; renderApply();
  setTimeout(()=>{
    const k=campaign(AF.kid);
    S.apps.push({id:'n'+(S.seq++), cr:'cr01', k:AF.kid, status:'applied', quote:k.type==='Product only'?0:AF.quote, pitch:AF.pitch.trim(), link:AF.link.trim(), applied:todayISO(), viewed:false});
    persist(); AF.submitting=false; AF.done=true; renderApply(); render();
  }, 800);
}

/* ---------- Creator profile drawer (brand) ---------- */
function openC(cid,kid){
  const c=creator(cid), k=campaign(kid); const a=appFor(cid,kid);
  if(a && !a.viewed){ a.viewed=true; persist(); }
  const e=evaluate(c,k,a?a.quote:null); const t=k.target;
  let foot;
  if(!a) foot = invited(cid,kid)? `<span class="small muted" style="flex:1">Invited. ${c.name.split(' ')[0]} will see your campaign at the top of their feed.</span>` : e.eligible? `<span class="small muted" style="flex:1">Hasn't applied. Inviting puts your campaign at the top of their feed.</span><button class="btn pri" data-act="invite" data-c="${cid}" data-k="${kid}">Invite to apply</button>` : `<span class="small" style="flex:1;color:var(--gold)">${esc(e.failed[0].text)}</span>`;
  else if(a.status==='applied') foot = `<button class="btn danger" data-act="declineOpen" data-a="${a.id}">Decline</button><span style="flex:1"></span><button class="btn pri" data-act="shortlist" data-a="${a.id}">Shortlist ${c.name.split(' ')[0]}</button>`;
  else if(a.status==='shortlisted') foot = `${pill('shortlisted',true)}<span style="flex:1"></span><button class="btn" data-act="unshort" data-a="${a.id}">Remove from shortlist</button><button class="btn pri" data-act="offersOpen" data-k="${kid}">Send offers</button>`;
  else foot = `${pill(a.status,true)}<span class="small muted">${a.status==='declined'?esc(a.reason):''}</span>`;
  const aud=c.aud;
  openDrawer(`
  <div class="dhead"><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button>${avatar(c,42)}<div style="flex:1;min-width:0"><h2 style="font-size:17px">${c.name}</h2><div class="small muted">${c.handle||''} · ${c.city} · ${c.cats.join(', ')}</div></div>${ring(e.score,50,!e.eligible)}</div>
  <div class="dbody">
    <div class="card pad sec"><div class="row between"><h3>Match for “${esc(k.title)}”</h3>${e.eligible?`<span class="band ${e.band}">${BAND_LABEL[e.band]}</span>`:''}</div>
      <div class="breakdown">${e.parts.map(p=>`<div class="bd"><span>${p.label}</span><div class="bar ${p.pts/p.max<.6?'gold':''}"><i style="width:${Math.round(p.pts/p.max*100)}%"></i></div><span class="pts">${Math.round(p.pts)}/${p.max}</span><span class="note">${esc(p.note)}</span></div>`).join('')}</div>
      ${e.gates.map(g=>`<div class="gate ${g.ok?'ok':'no'}">${ic(g.ok?'check':'x')}<span>${esc(g.text)}</span></div>`).join('')}
    </div>
    ${a?`<div class="card pad sec"><div class="row between"><h3>Application</h3><span class="small muted">Applied ${fmtD(a.applied)}</span></div><div class="row wrapf" style="gap:20px"><div class="stat"><b>${inr(a.quote)}</b><small>quote</small></div><div class="stat"><b>${inr(packageRate(c,k))}</b><small>usual rate for this package</small></div></div><p style="margin:0;white-space:pre-wrap" class="ink2">“${esc(a.pitch)}”</p>${a.link?`<div class="small" style="word-break:break-all">Sample: ${esc(a.link)}</div>`:''}</div>`:''}
    <div class="card pad sec"><h3>Platforms</h3><div class="plat">${Object.entries(c.platforms).map(([p,v])=>`<div class="platbox"><div class="row between"><span class="small" style="font-weight:600">${PLAT[p]}</span>${c.verified[p]?'<span class="chip acc">Verified</span>':'<span class="chip gold">Self-reported</span>'}</div><div class="v num">${fol(v.f)}</div><div class="small muted">${v.er}% engagement (typical ${BENCH(v.f).toFixed(1)}%)</div></div>`).join('')}</div></div>
    <div class="card pad sec"><div class="row between"><h3>Audience</h3><span class="small muted">Highlighted = your target</span></div>
      <div class="aud ${t.gender!=='male'&&t.gender!=='all'?'hl':''}"><span>Women</span><div class="bar"><i style="width:${pct(aud.female)}"></i></div><span class="num">${pct(aud.female)}</span></div>
      <div class="aud ${t.gender==='male'?'hl':''}"><span>Men</span><div class="bar"><i style="width:${pct(1-aud.female)}"></i></div><span class="num">${pct(1-aud.female)}</span></div>
      <div class="divider"></div>
      ${AGES.map(x=>`<div class="aud ${t.ages.includes(x)?'hl':''}"><span>${AGE_LABEL[x]}</span><div class="bar"><i style="width:${pct(aud.ages[x])}"></i></div><span class="num">${pct(aud.ages[x])}</span></div>`).join('')}
      <div class="divider"></div>
      <div class="aud ${t.geo==='metro'?'hl':''}"><span>Metros</span><div class="bar"><i style="width:${pct(aud.metro)}"></i></div><span class="num">${pct(aud.metro)}</span></div>
      <div class="small muted">Top cities: ${aud.cities}</div></div>
    <div class="card pad sec"><h3>Track record on Tessera</h3><div class="grid g2" style="gap:10px"><div class="stat"><b>${c.done}</b><small>collaborations</small></div><div class="stat"><b>${c.done?`${c.onTime} of ${c.done}`:'–'}</b><small>on time</small></div></div></div>
  </div><div class="dfoot">${foot}</div>`);
}

/* ---------- Find creators ---------- */

  return `<div class="pagehead"><div><h1>Find creators</h1><p>Search the creator pool. Scores are calculated against the campaign you pick.</p></div>
    <div class="field" style="min-width:min(320px,100%)"><label for="fk">Score against</label><select id="fk" class="sel" data-f2="fk">${ks.map(k=>`<option value="${k.id}" ${UI.fk===k.id?'selected':''}>${esc(k.title)}</option>`).join('')}</select></div></div>
  <div class="card pad"><div class="filters">
    <label class="search">${ic('search')}<input id="fq" type="search" data-f2="fq" placeholder="Search by name, handle or city" value="${esc(UI.fq)}" aria-label="Search creators"></label>
    <select id="fniche" class="sel" data-f2="fniche" aria-label="Niche"><option value="all">All niches</option>${CATS.map(c=>`<option ${UI.fniche===c?'selected':''}>${c}</option>`).join('')}</select>
    <select id="fplat" class="sel" data-f2="fplat" aria-label="Platform"><option value="all">Any platform</option><option value="instagram" ${UI.fplat==='instagram'?'selected':''}>Instagram</option><option value="youtube" ${UI.fplat==='youtube'?'selected':''}>YouTube</option></select>
    <select id="ftier" class="sel" data-f2="ftier" aria-label="Size"><option value="all">Any size</option><option value="micro" ${UI.ftier==='micro'?'selected':''}>10K–50K</option><option value="mid" ${UI.ftier==='mid'?'selected':''}>50K–100K</option><option value="macro" ${UI.ftier==='macro'?'selected':''}>100K+</option></select>
    <select id="fer" class="sel" data-f2="fer" aria-label="Engagement"><option value="0">Any engagement</option>${[3,4,5].map(v=>`<option value="${v}" ${+UI.fer===v?'selected':''}>${v}%+ engagement</option>`).join('')}</select>
    <select id="fcity" class="sel" data-f2="fcity" aria-label="City"><option value="all">Any city</option>${CITIES.map(c=>`<option ${UI.fcity===c?'selected':''}>${c}</option>`).join('')}</select>
  </div></div>

function renderFindResults(){
  const box=document.getElementById('fresults'); if(!box) return;
  if(!UI.loaded.find){ box.innerHTML=`<div class="card">${[0,1,2,3].map(()=>`<div class="li" style="grid-template-columns:36px 1fr 60px"><div class="skel" style="width:36px;height:36px;border-radius:50%"></div><div><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:10px;width:60%;margin-top:8px"></div></div><div class="skel" style="height:36px;border-radius:50%;width:36px"></div></div>`).join('')}</div>`; setTimeout(()=>{UI.loaded.find=true;renderFindResults();},400); return; }
  const k=campaign(UI.fk); const q=UI.fq.trim().toLowerCase();
  let list=creators().map(c=>({c, e:evaluate(c,k), a:appFor(c.id,k.id)})).filter(({c})=>{
    const ig=c.platforms.instagram?c.platforms.instagram.f:0, maxF=Math.max(...Object.values(c.platforms).map(p=>p.f));
    if(q && !`${c.name} ${c.handle} ${c.city}`.toLowerCase().includes(q)) return false;
    if(UI.fniche!=='all' && !c.cats.includes(UI.fniche)) return false;
    if(UI.fplat!=='all' && !c.platforms[UI.fplat]) return false;
    if(UI.ftier==='micro' && !(maxF>=10000&&maxF<50000)) return false;
    if(UI.ftier==='mid' && !(maxF>=50000&&maxF<100000)) return false;
    if(UI.ftier==='macro' && maxF<100000) return false;
    if(+UI.fer && maxER(c)<+UI.fer) return false;
    if(UI.fcity!=='all' && c.city!==UI.fcity) return false;
    return true;
  }).sort((x,y)=> (y.e.eligible-x.e.eligible) || (y.e.score-x.e.score));
  const filtersOn=q||UI.fniche!=='all'||UI.fplat!=='all'||UI.ftier!=='all'||+UI.fer||UI.fcity!=='all';
  if(!list.length){ box.innerHTML=`<div class="card"><div class="empty"><div class="ic">${ic('users')}</div><h3>No creators match these filters</h3><p>Widen the size range or engagement filter.</p><button class="btn sm" data-act="clearF2">Clear filters</button></div></div>`; return; }
  box.innerHTML = `<div class="resultline" style="margin-bottom:10px">${list.length} of ${creators().length} creators in the demo pool${filtersOn?' match your filters':''} · ${list.filter(x=>x.e.eligible).length} meet every requirement</div>
  <div class="card"><div class="thead li-cand"><span>Creator</span><span class="hide-m">Reach</span><span class="hide-m">Why they match</span><span>Match</span><span></span></div><div class="list">${list.map(x=>{
    if(x.e.eligible) return candRow({c:x.c,e:x.e,a:x.a},k);
    const c=x.c, p=Object.values(c.platforms)[0];
    return `<div class="li li-cand" style="opacity:.75"><div class="row" style="min-width:0">${avatar(c)}<div style="min-width:0"><button class="name-btn" data-act="openC" data-c="${c.id}" data-k="${k.id}">${esc(c.name)}</button><div class="small muted">${c.city} · ${c.cats.slice(0,2).join(', ')}</div></div></div><div class="hide-m stat"><b>${fol(p.f)}</b><small>${p.er}% engagement</small></div><div class="hide-m small" style="color:var(--gold)">${esc(x.e.failed[0].text)}</div><div>${ring(0,40,true)}</div><div class="row" style="justify-content:flex-end"><span class="chip">Not eligible</span></div></div>`;
  }).join('')}</div></div>`;
}

/* ---------- Shortlist ---------- */
function bShortlist(){
  const ks=koraCampaigns();
  const blocks=ks.map(k=>{
    const sl=appsOn(k.id).filter(a=>['shortlisted','offer','selected'].includes(a.status)).map(a=>({a,c:creator(a.cr),e:evaluate(creator(a.cr),k,a.quote)})).sort((x,y)=>y.e.score-x.e.score);
    const pend=sl.filter(x=>x.a.status==='shortlisted');
    const fees=sl.reduce((s,x)=>s+x.a.quote,0);
    return `<div class="card"><div class="pad row between wrapf"><div><h2>${esc(k.title)}</h2><div class="small muted">${sl.length} of ${k.slots} slots · fees ${inr(fees)} + 15% commission = ${inr(fees*(1+COMMISSION))}</div></div>
      ${pend.length?`<button class="btn pri" data-act="offersOpen" data-k="${k.id}">Send ${pend.length} offer${pend.length===1?'':'s'}</button>`:''}</div>
      <div class="pad" style="padding-top:0"><div class="bar"><i style="width:${Math.min(100,Math.round(sl.length/k.slots*100))}%"></i></div></div>
      ${sl.length?`<div class="list">${sl.map(x=>`<div class="li" style="grid-template-columns:minmax(0,1fr) auto auto auto">${`<div class="row" style="min-width:0">${avatar(x.c)}<div style="min-width:0"><button class="name-btn" data-act="openC" data-c="${x.c.id}" data-k="${k.id}">${esc(x.c.name)}</button><div class="small muted">${x.c.city} · ${esc(x.e.reasons[0]||'')}</div></div></div>`}<span class="num hide-m">${inr(x.a.quote)}</span>${ring(x.e.score,38)}<div class="row" style="gap:6px">${pill(x.a.status,true)}${x.a.status==='shortlisted'?`<button class="btn sm ghost" data-act="unshort" data-a="${x.a.id}">Remove</button>`:''}</div></div>`).join('')}</div>`
      :`<div class="empty"><div class="ic">${ic('star')}</div><h3>No one shortlisted yet</h3><p>Review applicants ranked by fit and shortlist up to ${k.slots}.</p><button class="btn sm" data-act="openCampaign" data-k="${k.id}">Review applicants</button></div>`}
    </div>`;
  }).join('');
  return `<div class="pagehead"><div><h1>Shortlist</h1><p>Shortlisted creators get an offer at the fee they quoted. They have 3 days to accept.</p></div></div>${blocks}`;
}

/* ---------- Create campaign ---------- */
const PRESETS = {r1:[['reel',1]], r1s3:[['reel',1],['story',3]], r2:[['reel',2]], yt1:[['video',1]], yt1r1:[['video',1],['reel',1]]};
const PRESET_LABEL = {r1:'1 Instagram Reel', r1s3:'1 Reel + 3 Stories', r2:'2 Instagram Reels', yt1:'1 YouTube integration', yt1r1:'YouTube integration + 1 Reel'};
let CF=null;
function startCreate(fromDraft){
  const d = fromDraft ? KORA_OTHERS.find(o=>o.id===fromDraft).draft : {title:'', cat:'Skincare', preset:'r1s3', min:20000, max:30000, minF:10000, gender:'female', ages:['18-24','25-34'], geo:'metro', slots:6, applyBy:'2026-11-24'};
  CF=Object.assign({errors:{}, fromDraft, done:null}, JSON.parse(JSON.stringify(d)));
  renderCreate();
}
function cfCampaign(){ return {id:'tmp', brand:'kora', title:CF.title||'Untitled', cat:CF.cat, type:'Paid', deliv:PRESETS[CF.preset], budget:[+CF.min||0,+CF.max||0], minF:+CF.minF, city:null, target:{gender:CF.gender, ages:CF.ages.length?CF.ages:['18-24'], geo:CF.geo}, slots:+CF.slots||1, posted:todayISO(), applyBy:CF.applyBy||'2026-12-31', due:'2026-12-31', status:'open'}; }
function cfPreview(){
  const k=cfCampaign(); const ev=creators().map(c=>({c,e:evaluate(c,k)}));
  const elig=ev.filter(x=>x.e.eligible), strong=elig.filter(x=>x.e.score>=80);
  const rates=strong.map(x=>packageRate(x.c,k)).sort((a,b)=>a-b);
  const med = rates.length? rates[Math.floor((rates.length-1)/2)] : 0;
  return {elig:elig.length, strong:strong.length, med, total:creators().length};
}
function renderCreate(){
  if(CF.done){
    const k=campaign(CF.done);
    openModal(`<div class="mhead"><div style="flex:1"><h2>Campaign is live</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
    <div class="mbody"><div class="success"><div class="ic">${ic('check')}</div><h2>“${esc(k.title)}” is live</h2><p class="ink2" style="margin:0;max-width:440px">Creators who meet your requirements now see it in their feed, ranked by fit. Strong matches who haven't applied are waiting in Suggested; inviting them is the fastest way to fill ${k.slots} slots.</p></div></div>
    <div class="mfoot"><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="openCampaign" data-k="${k.id}" data-t="suggested">See suggested creators</button></div>`, true);
    return;
  }
  const pv=cfPreview(); const E=CF.errors;
  const warn = pv.strong && +CF.max && +CF.max < pv.med ? `<div class="banner gold" style="padding:10px 12px">${ic('alert')}<div class="t small">Your max budget (${inr(+CF.max)}) is below the median rate of your strong matches (${inr(pv.med)}). Expect fewer applications from them.</div></div>`
    : pv.elig < +CF.slots ? `<div class="banner gold" style="padding:10px 12px">${ic('alert')}<div class="t small">Fewer eligible creators (${pv.elig}) than slots (${CF.slots}). Lower the follower minimum or widen the audience.</div></div>`
    : `<div class="banner acc" style="padding:10px 12px">${ic('check')}<div class="t small">Healthy pool: enough strong matches to fill ${CF.slots} slots at this budget.</div></div>`;
  openModal(`<div class="mhead"><div style="flex:1"><div class="small muted">${CF.fromDraft?'Finish draft':'New campaign'}</div><h2>Campaign brief</h2><div class="small muted">Every field here is used for matching. Structured requirements replace the free-text brief.</div></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="mbody"><div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px" class="cf-grid">
    <div class="sec">
      <div class="field"><label for="cf-title">Campaign name</label><input id="cf-title" class="input ${E.title?'bad':''}" data-cf="title" value="${esc(CF.title)}" placeholder="e.g. Ceramide Cleanser relaunch">${E.title?`<div class="err">${E.title}</div>`:''}</div>
      <div class="fgrid">
        <div class="field"><label for="cf-cat">Niche</label><select id="cf-cat" class="sel" data-cf="cat">${CATS.map(c=>`<option ${CF.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="cf-preset">Deliverables per creator</label><select id="cf-preset" class="sel" data-cf="preset">${Object.keys(PRESETS).map(p=>`<option value="${p}" ${CF.preset===p?'selected':''}>${PRESET_LABEL[p]}</option>`).join('')}</select></div>
        <div class="field"><label for="cf-min">Budget per creator: min</label><div class="prefix"><span>₹</span><input id="cf-min" class="input num ${E.budget?'bad':''}" inputmode="numeric" data-cf="min" value="${CF.min}"></div></div>
        <div class="field"><label for="cf-max">Budget per creator: max</label><div class="prefix"><span>₹</span><input id="cf-max" class="input num ${E.budget?'bad':''}" inputmode="numeric" data-cf="max" value="${CF.max}"></div></div>
      </div>${E.budget?`<div class="err" style="color:var(--bad);font-size:12px;margin-top:-8px">${E.budget}</div>`:''}

        <div class="field"><label for="cf-minf">Minimum followers</label><select id="cf-minf" class="sel" data-cf="minF">${[5000,10000,20000,50000,100000].map(v=>`<option value="${v}" ${+CF.minF===v?'selected':''}>${fol(v)}+</option>`).join('')}</select></div>
        <div class="field"><label for="cf-slots">Creators needed</label><input id="cf-slots" class="input num ${E.slots?'bad':''}" inputmode="numeric" data-cf="slots" value="${CF.slots}">${E.slots?`<div class="err">${E.slots}</div>`:''}</div>
        <div class="field"><label for="cf-gender">Audience gender</label><select id="cf-gender" class="sel" data-cf="gender"><option value="all" ${CF.gender==='all'?'selected':''}>Any</option><option value="female" ${CF.gender==='female'?'selected':''}>Mostly women</option><option value="male" ${CF.gender==='male'?'selected':''}>Mostly men</option></select></div>
        <div class="field"><label for="cf-geo">Audience location</label><select id="cf-geo" class="sel" data-cf="geo"><option value="metro" ${CF.geo==='metro'?'selected':''}>Metro cities</option><option value="india" ${CF.geo==='india'?'selected':''}>All India</option></select></div>
      </div>
      <div class="field"><span class="lbl">Audience age</span><div class="checks">${AGES.map(x=>`<label class="checkchip"><input type="checkbox" data-cf="age" value="${x}" ${CF.ages.includes(x)?'checked':''}><span>${AGE_LABEL[x]}</span></label>`).join('')}</div>${E.ages?`<div class="err">${E.ages}</div>`:''}</div>
      <div class="field"><label for="cf-date">Applications close</label><input id="cf-date" type="date" class="input ${E.applyBy?'bad':''}" data-cf="applyBy" value="${CF.applyBy}" min="2026-11-13">${E.applyBy?`<div class="err">${E.applyBy}</div>`:'<div class="hint">At least 3 days from today, so creators have time to apply.</div>'}</div>
    </div>
    <div class="preview" id="cf-preview">
      <div class="eyebrow">Live marketplace preview</div>
      <div><div class="big num">${pv.elig}</div><div class="small ink2">of ${pv.total} creators in the demo pool meet your requirements</div></div>
      <div><div class="big num" style="color:var(--accent)">${pv.strong}</div><div class="small ink2">are strong matches (score 80+)</div></div>
      <div><div class="big num" style="font-size:22px">${pv.med?inr(pv.med):'–'}</div><div class="small ink2">median usual rate of strong matches for ${PRESET_LABEL[CF.preset]}</div></div>
      ${warn}
      <div class="small muted">Updates as you edit. Same rules creators see.</div>
    </div>
  </div></div>
  <div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="cfSubmit">Publish campaign</button></div>`, true);
}
function validateCreate(){
  const E={}; const min=+String(CF.min).replace(/\D/g,''), max=+String(CF.max).replace(/\D/g,''), slots=+String(CF.slots).replace(/\D/g,'');
  if(CF.title.trim().length<6) E.title='Give the campaign a name of at least 6 characters.';
  if(!min||!max) E.budget='Enter both a minimum and maximum budget.'; else if(max<min) E.budget='Maximum must be at least the minimum.'; else if(min<2000) E.budget='Minimum budget is ₹2,000 per creator.';
  if(!slots||slots<1||slots>30) E.slots='Choose between 1 and 30 creators.';
  if(!CF.ages.length) E.ages='Pick at least one age group.';
  if(!CF.applyBy || daysTo(CF.applyBy)<3) E.applyBy='Pick a date at least 3 days from today (13 Nov or later).';
  CF.errors=E; return !Object.keys(E).length;
}
function submitCreate(){
  const id='k'+(S.seq++);
  S.custom.push({id, brand:'kora', title:CF.title.trim(), cat:CF.cat, type:'Paid', deliv:PRESETS[CF.preset], budget:[+CF.min,+CF.max], minF:+CF.minF, city:null,
    target:{gender:CF.gender, ages:CF.ages.slice(), geo:CF.geo}, slots:+CF.slots, posted:todayISO(), applyBy:CF.applyBy, due:addDays(CF.applyBy,18), status:'open', modeled:true,
    brief:'New campaign created in the prototype. The full brief would be written here.', dos:[], donts:[]});
  if(CF.fromDraft) S.drafts[CF.fromDraft]=false;
  persist(); CF.done=id; UI.kid=id; renderCreate(); render(); toast('Campaign published. Matching creators can see it now.');
}

/* ---------- Offers ---------- */
function offersOpen(kid){
  const k=campaign(kid); const pend=appsOn(kid).filter(a=>a.status==='shortlisted');
  const fees=pend.reduce((s,a)=>s+a.quote,0);
  openModal(`<div class="mhead"><div style="flex:1"><div class="small muted">${esc(k.title)}</div><h2>Send ${pend.length} offer${pend.length===1?'':'s'}</h2></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="mbody"><div class="card"><div class="list">${pend.map(a=>{const c=creator(a.cr);return `<div class="li" style="grid-template-columns:1fr auto">${`<div class="row">${avatar(c,32)}<span>${c.name}</span></div>`}<span class="num">${inr(a.quote)}</span></div>`}).join('')}</div></div>
  <dl class="kv"><dt>Creator fees</dt><dd class="num">${inr(fees)}</dd><dt>Tessera commission (15%)</dt><dd class="num">${inr(fees*COMMISSION)}</dd><dt><b>Total if all accept</b></dt><dd class="num"><b>${inr(fees*(1+COMMISSION))}</b></dd></dl>
  <div class="small muted">You're only charged for creators who accept. Each has 3 days to respond. Funds are held by Tessera and released 7 days after you approve their content.</div></div>
  <div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="offersSend" data-k="${kid}">Send offers</button></div>`);
}

/* ---------- Decline ---------- */
let DC=null;
function declineOpen(aid){
  const a=S.apps.find(x=>x.id===aid), c=creator(a.cr);
  DC={aid, reason:'', err:''};
  const draw=()=>openModal(`<div class="mhead"><div style="flex:1"><h2>Decline ${c.name}?</h2><div class="small muted">Pick a reason. ${c.name.split(' ')[0]} sees it, which helps them apply better next time.</div></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
    <div class="mbody"><fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="sr" style="position:absolute;left:-9999px">Reason</legend>${DECLINE_REASONS.map((r,i)=>`<label class="confirm" for="dr-${i}"><input type="radio" name="dr" id="dr-${i}" data-dc="${esc(r)}" ${DC.reason===r?'checked':''}><span>${esc(r)}</span></label>`).join('')}</fieldset>${DC.err?`<div class="err" style="color:var(--bad);font-size:12px">${DC.err}</div>`:''}</div>
    <div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="declineConfirm">Decline applicant</button></div>`);
  DC.draw=draw; draw();
}

/* ---------- Explainer + guide ---------- */
function explain(){
  openModal(`<div class="mhead"><div style="flex:1"><h2>How match scores work</h2><div class="small muted">Plain rules, no black box. Brands and creators see the same numbers.</div></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="mbody">
    <div class="sec"><h3>1. Hard requirements</h3><p class="ink2" style="margin:0">If a creator misses one, they can't apply. Brands set these: platform, minimum followers on the main platform, and city for on-site work.</p></div>
    <div class="sec"><h3>2. Score out of 100</h3>
      <dl class="kv"><dt>Niche fit · 30</dt><dd>Primary niche 30, secondary 22, related niche 10.</dd>
      <dt>Audience fit · 30</dt><dd>Gender 12, age 12, metro share 6. Compares the creator's audience split to the brand's target.</dd>
      <dt>Engagement · 20</dt><dd>Engagement rate against what's typical for accounts of that size.</dd>
      <dt>Budget fit · 15</dt><dd>Does the brand's budget cover the creator's usual rate (or their quote)?</dd>
      <dt>Reliability · 5</dt><dd>On-time delivery on past Tessera collaborations. New creators get a neutral 4/5, so being new doesn't sink you.</dd></dl></div>
    <div class="sec"><h3>3. Labels</h3><div class="row wrapf"><span class="band strong">80+ Strong match</span><span class="band good">65–79 Good match</span><span class="band stretch">Below 65 Stretch</span></div></div>
    <div class="small muted">Version 1 is deliberately simple. Weights get tuned on real shortlist and completion data after launch.</div>
  </div><div class="mfoot"><button class="btn pri" data-act="close">Got it</button></div>`);
}
function guide(){
  openModal(`<div class="mhead"><div style="flex:1"><h2>Demo script (3 minutes)</h2><div class="small muted">Both sides share the same data, so actions on one side show up on the other.</div></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div>
  <div class="mbody guide"><ol>
    <li><b>Creator · Discover.</b> Filter and sort. Open the <i>Not eligible yet</i> tab to see why Velvet & Vine is locked (1.8K followers short).</li>
    <li><b>Creator.</b> Open <i>Monsoon Barrier Serum</i>, read the match breakdown, and apply. Try submitting a short pitch to see validation.</li>
    <li><b>Switch to Brand · Campaign.</b> Aanya now appears in <i>To review</i>, ranked by score. Open her profile, then shortlist her.</li>
    <li><b>Brand · Suggested.</b> Invite Mira Shah or Pooja Nair: strong matches who haven't applied.</li>
    <li><b>Brand · Shortlist.</b> Send offers. See fees + 15% commission.</li>
    <li><b>Switch to Creator · Home.</b> Aanya sees the offer. Accept it in Applications.</li>
    <li><b>Brand · Overview → New campaign.</b> Change budget and audience and watch the live pool estimate react.</li>
  </ol></div><div class="mfoot"><button class="btn pri" data-act="close">Start</button></div>`);
}

const VIEWS = {'c-home':cHome, 'c-discover':cDiscover, 'c-applications':cApps, 'c-profile':cProfile, 'b-home':bHome, 'b-campaign':bCampaign, 'b-creators':bCreators, 'b-shortlist':bShortlist};

/* ============ Overlay helpers ============ */
let lastFocus=null;
function openDrawer(html){ closeModal(); lastFocus=document.activeElement; const d=document.getElementById('drawer'); d.innerHTML=html; d.classList.add('on'); document.getElementById('scrim').classList.add('on'); const f=d.querySelector('button'); f&&f.focus(); }
function openModal(html, wide){ const m=document.getElementById('modal'); const wasOn=m.classList.contains('on'); const scroll = wasOn && m.querySelector('.mbody') ? m.querySelector('.mbody').scrollTop : 0; if(!wasOn) lastFocus=document.activeElement; m.innerHTML=html; m.classList.toggle('wide',!!wide); m.classList.add('on'); document.getElementById('scrim').classList.add('on'); if(scroll) m.querySelector('.mbody').scrollTop=scroll; if(!wasOn){ const f=m.querySelector('input,textarea,select')||m.querySelector('.mfoot .btn.pri'); f&&f.focus(); } }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function closeAll(){ closeModal(); document.getElementById('drawer').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); AF=null; CF=null; DC=null; lastFocus&&lastFocus.focus&&document.body.contains(lastFocus)&&lastFocus.focus(); }
function closeTop(){ const m=document.getElementById('modal'); if(m.classList.contains('on') && document.getElementById('drawer').classList.contains('on')){ closeModal(); AF=null; CF=null; DC=null; return; } closeAll(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeTop(); });

/* ============ Actions ============ */
const ACT = {
  nav:d=>{ closeAll(); go(d.v); },
  role:d=>{ closeAll(); S.role=d.role; persist(); go(d.role==='brand'?'b-home':'c-home'); },
  reset:()=>{ S=fresh(); PF=null; persist(); closeAll(); Object.assign(UI,{dtab:'eligible',q:'',niche:'all',plat:'all',comp:0,ctype:'all',audfit:false,sort:'match',appsf:'all',kid:'k01',ctab:'applicants',band:'all',fq:'',fniche:'all',fplat:'all',ftier:'all',fer:0,fk:'k01',fcity:'all'}); go('c-home'); toast('Demo reset to its starting data.'); },
  guide:()=>guide(),
  explain:()=>explain(),
  close:()=>closeTop(),
  openK:d=>openK(d.k),
  save:d=>{ S.saved[d.k]=!S.saved[d.k]; if(!S.saved[d.k]) delete S.saved[d.k]; persist(); renderDiscoverResults(); renderShell(view()); toast(S.saved[d.k]?'Saved. Find it under the Saved tab.':'Removed from saved.'); },
  watch:d=>{ S.watch[d.k]=!S.watch[d.k]; persist(); openK(d.k); toast(S.watch[d.k]?'We\'ll notify you if you meet the requirements before applications close.':'Notification turned off.'); },
  dtab:d=>{ UI.dtab=d.t; renderDiscoverResults(); },
  clearF:()=>{ Object.assign(UI,{q:'',niche:'all',plat:'all',comp:0,ctype:'all',audfit:false}); render(); },
  clearF2:()=>{ Object.assign(UI,{fq:'',fniche:'all',fplat:'all',ftier:'all',fer:0,fcity:'all'}); render(); },
  apply:d=>{ startApply(d.k); },
  afNext:()=>{ if(!validateApply()){ renderApply(); return; } AF.step++; renderApply(); },
  afBack:()=>{ AF.errors={}; AF.step--; renderApply(); },
  afSubmit:()=>submitApply(),
  appsf:d=>{ UI.appsf=d.t; render(); },
  withdraw:d=>{ const a=S.apps.find(x=>x.id===d.a), k=campaign(a.k);
    openModal(`<div class="mhead"><div style="flex:1"><h2>Withdraw application?</h2><div class="small muted">${esc(k.title)} · ${BRANDS[k.brand].name}</div></div><button class="iconbtn" data-act="close" aria-label="Close">${ic('x')}</button></div><div class="mbody"><p style="margin:0" class="ink2">The brand will no longer see your application. You can apply again while applications are open (until ${fmtD(k.applyBy)}).</p></div><div class="mfoot"><button class="btn" data-act="close">Keep application</button><button class="btn danger" data-act="withdrawConfirm" data-a="${a.id}">Withdraw</button></div>`); },
  withdrawConfirm:d=>{ const a=S.apps.find(x=>x.id===d.a); a.status='withdrawn'; persist(); closeAll(); render(); toast('Application withdrawn.'); },
  acceptOffer:d=>{ const a=S.apps.find(x=>x.id===d.a); a.status='selected'; persist(); render(); toast(`Offer accepted. The full brief is unlocked and ${inr(a.quote)} is held for you.`); },
  pfSave:()=>{
    const E={}; if(PF.cats.length<1) E.cats='Pick at least one niche.';
    Object.keys(PF.rates).forEach(t=>{ const v=+String(PF.rates[t]).replace(/\D/g,''); PF.rates[t]=v; if(me().platforms[DELIV[t].p] && (!v||v<500)) E[t]='Enter a rate of ₹500 or more.'; });
    PF.errors=E; if(Object.keys(E).length){ render(); return; }
    const before=creatorFeed().filter(x=>x.e.eligible&&x.e.score>=80).length;
    S.profile={cats:PF.cats.slice(), city:PF.city, rates:Object.assign({},PF.rates), productOnly:PF.productOnly}; persist();
    const after=creatorFeed().filter(x=>x.e.eligible&&x.e.score>=80).length; PF=null; render();
    toast(`Profile saved. Match scores updated: ${after} strong match${after===1?'':'es'} (was ${before}).`);
  },
  pfReset:()=>{ PF=null; render(); toast('Changes discarded.'); },
  connectYT:()=>{ S.ytVerified=true; persist(); PF=null; render(); toast('YouTube verified. Brands now see a verified badge on your channel.'); },
  // brand
  openCampaign:d=>{ closeAll(); UI.kid=d.k; UI.ctab=d.t||'applicants'; UI.band='all'; go('b-campaign'); },
  ctab:d=>{ UI.ctab=d.t; render(); },
  band:d=>{ UI.band=d.b; render(); },
  openC:d=>openC(d.c,d.k),
  shortlist:d=>{ const a=S.apps.find(x=>x.id===d.a), k=campaign(a.k); const n=appsOn(k.id).filter(x=>['shortlisted','offer','selected'].includes(x.status)).length;
    if(n>=k.slots){ toast(`All ${k.slots} slots are taken. Remove someone first.`); return; }
    a.status='shortlisted'; a.viewed=true; persist(); const dr=document.getElementById('drawer').classList.contains('on'); render(); if(dr) openC(a.cr,a.k); toast(`${creator(a.cr).name} shortlisted (${n+1} of ${k.slots}).`); },
  unshort:d=>{ const a=S.apps.find(x=>x.id===d.a); a.status='applied'; persist(); const dr=document.getElementById('drawer').classList.contains('on'); render(); if(dr) openC(a.cr,a.k); toast('Moved back to To review.'); },
  invite:d=>{ if(!invited(d.c,d.k)) S.invites.push({cr:d.c,k:d.k}); persist(); const dr=document.getElementById('drawer').classList.contains('on'); render(); if(dr) openC(d.c,d.k); toast(`${creator(d.c).name} invited. Your campaign is now pinned at the top of their feed.`); },
  declineOpen:d=>declineOpen(d.a),
  declineConfirm:()=>{ if(!DC.reason){ DC.err='Choose a reason so the creator gets useful feedback.'; DC.draw(); return; } const a=S.apps.find(x=>x.id===DC.aid); a.status='declined'; a.reason=DC.reason; a.viewed=true; persist(); const name=creator(a.cr).name; closeAll(); render(); toast(`${name} declined. They'll see: “${a.reason}”.`); },
  offersOpen:d=>offersOpen(d.k),
  offersSend:d=>{ const pend=appsOn(d.k).filter(a=>a.status==='shortlisted'); pend.forEach(a=>{a.status='offer'; a.offerOn=todayISO();}); persist(); closeAll(); render(); toast(`${pend.length} offer${pend.length===1?'':'s'} sent. Creators have 3 days to accept.`); },
  newCampaign:()=>startCreate(null),
  draftCampaign:d=>startCreate(d.k),
  cfSubmit:()=>{ if(!validateCreate()){ renderCreate(); return; } submitCreate(); }
};
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const fn=ACT[t.dataset.act]; if(fn){ e.preventDefault(); fn(t.dataset, t, e); }
});

/* ============ Inputs ============ */
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.f){ const k=t.dataset.f; UI[k]= t.type==='checkbox'? t.checked : t.value;
    if(k==='kid'){ render(); return; }
    if(k==='bsort'){ render(); return; }
    renderDiscoverResults(); return; }
  if(t.dataset.f2){ UI[t.dataset.f2]=t.value; if(t.dataset.f2==='fk'){ render(); return; } renderFindResults(); return; }
  if(t.dataset.af && AF){ const k=t.dataset.af; AF[k]= t.type==='checkbox'? t.checked : t.value;
    if(k==='pitch'){ const c=document.getElementById('ap-count'); if(c) c.textContent=t.value.trim().length+'/600'; }
    if(t.type==='checkbox' && AF.errors[k]){ delete AF.errors[k]; renderApply(); }
    return; }
  if(t.dataset.cf && CF){ const k=t.dataset.cf;
    if(k==='age'){ CF.ages = t.checked ? [...new Set([...CF.ages,t.value])] : CF.ages.filter(x=>x!==t.value); CF.ages.sort((a,b)=>AGES.indexOf(a)-AGES.indexOf(b)); }
    else CF[k]=t.value;
    const pos = t.selectionStart; const id=t.id;
    renderCreate();
    const n=document.getElementById(id); if(n){ n.focus(); try{ if(pos!=null && n.setSelectionRange && n.type!=='date') n.setSelectionRange(pos,pos);}catch(_){} }
    return; }
  if(t.dataset.pf && PF){ const k=t.dataset.pf;
    if(k==='cat'){ if(t.checked){ if(PF.cats.length>=3){ t.checked=false; toast('Pick up to 3 niches. Remove one first.'); return; } PF.cats.push(t.value);} else PF.cats=PF.cats.filter(x=>x!==t.value); render(); return; }
    if(k==='rate') PF.rates[t.dataset.t]=t.value;
    if(k==='city') PF.city=t.value;
    if(k==='po') PF.productOnly=t.checked;
    return; }
  if(t.dataset.dc!==undefined && DC){ DC.reason=t.dataset.dc; DC.err=''; }
});
document.addEventListener('change', e=>{ const t=e.target; if(t.tagName==='SELECT' && (t.dataset.f||t.dataset.f2)){ /* handled by input */ } });

render();
</script>
<style>
@media (max-width:760px){ .cf-grid{grid-template-columns:1fr!important} }
</style>
</body>
